<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Power Gym Admin | Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --soft:#f8fafc; --fg:#0f172a; --muted:#64748b; --line:#e2e8f0; --line-2:#cbd5e1;
    --accent:#0ea5e9; --btn:#0f172a; --btn-fg:#ffffff; --shadow:0 1px 2px rgba(15,23,42,.06);
    --ok:#047857; --warn:#b45309; --bad:#b91c1c; --off:#475569; --new:#0369a1;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#020617; --soft:#0b1220; --fg:#e2e8f0; --muted:#94a3b8; --line:#1e293b; --line-2:#334155;
      --accent:#38bdf8; --btn:#f1f5f9; --btn-fg:#0f172a; --shadow:none;
      --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --off:#94a3b8; --new:#38bdf8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1080px;margin-inline:auto;padding-inline:20px}

  /* Wireframe strip */
  .strip{background:var(--soft);border-bottom:1px dashed var(--line-2);font-size:12px;color:var(--muted)}
  .strip .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;min-height:36px}
  .strip b{color:var(--fg);font-weight:600}
  .strip a{color:var(--muted)} .strip a:hover{color:var(--fg)}

  /* Top bar */
  .top{border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);z-index:20}
  .top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--fg)}
  .brand i{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line-2);border-radius:8px;font-style:normal;font-size:12px}
  .brand small{font-weight:500;color:var(--muted)}
  .top nav{display:flex;gap:6px;align-items:center}

  .theme{width:36px;padding:0}
  .theme svg{width:18px;height:18px}
  .theme .i-sun{display:none}
  :root[data-theme="dark"] .theme .i-sun{display:block}
  :root[data-theme="dark"] .theme .i-moon{display:none}

  /* Basics */
  main{padding-block:32px 96px}
  h1{font-size:24px;font-weight:700;letter-spacing:-.02em}
  h2{font-size:16px;font-weight:600}
  .sub{color:var(--muted);margin-top:4px}
  .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .stack{display:grid;gap:16px}
  .card{border:1px solid var(--line);border-radius:12px;background:var(--bg);box-shadow:var(--shadow)}
  .pad{padding:20px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);font-weight:500;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
  .btn:hover{background:var(--soft);border-color:var(--muted)}
  .btn.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
  .btn.primary:hover{opacity:.9}
  .btn.danger{color:var(--bad)}
  .btn.sm{height:30px;padding:0 10px;font-size:13px}
  .btn.ghost{border-color:transparent}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
  .link:hover{text-decoration:underline}
  .link.bad{color:var(--bad)}

  label{display:block;font-weight:500;margin-bottom:6px}
  .field{margin-bottom:16px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
    width:100%;height:38px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);outline:none}
  textarea{height:80px;padding:10px 12px;resize:vertical}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  /* Badge */
  .badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 25%,transparent);white-space:nowrap}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
  .s-activo{--c:var(--ok)} .s-porvencer{--c:var(--warn)} .s-vencido{--c:var(--bad)} .s-baja{--c:var(--off)} .s-pendiente{--c:var(--new)}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-block:24px}
  .stat{text-align:left;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;transition:border-color .15s}
  .stat:hover,.stat.on{border-color:var(--fg)}
  .stat small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:500}
  .stat small::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--line-2))}
  .stat b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px}

  /* Toolbar & chips */
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .search{position:relative;flex:1;min-width:220px;max-width:340px}
  .search input{padding-left:36px}
  .search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:13px;font-weight:500;cursor:pointer}
  .chip:hover{color:var(--fg)}
  .chip.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}

  /* Table */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
  td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover td{background:var(--soft)}
  td .name{font-weight:600} td .ph{color:var(--muted);font-size:12px}
  td.r,th.r{text-align:right}
  .void td{color:var(--muted)} .void .amt{text-decoration:line-through}
  .empty{padding:48px 16px;text-align:center;color:var(--muted)}

  /* Profile */
  .crumb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);margin-bottom:16px;background:none;border:0;cursor:pointer}
  .crumb:hover{color:var(--fg)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-block:20px}
  .kpi{padding:16px;border:1px solid var(--line);border-radius:12px}
  .kpi small{display:block;color:var(--muted);font-size:12px;font-weight:500}
  .kpi b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
  .kpi span{color:var(--muted);font-size:12px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab{padding:10px 14px;border:0;background:none;color:var(--muted);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--fg)}
  .tab.on{color:var(--fg);border-color:var(--fg)}

  /* Notes (wireframe annotations) */
  details.notes{margin-bottom:24px;border:1px dashed var(--line-2);border-radius:10px;background:var(--soft);font-size:13px;color:var(--muted)}
  details.notes summary{cursor:pointer;padding:9px 14px;font-weight:600;color:var(--fg);list-style:none}
  details.notes summary::before{content:"▸ ";color:var(--muted)}
  details.notes[open] summary::before{content:"▾ "}
  details.notes ul{padding:0 16px 14px 32px}
  details.notes li{margin-top:4px}

  /* Segmented */
  .seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-2);border-radius:8px;padding:3px;gap:3px}
  .seg button{height:32px;border:0;border-radius:6px;background:none;cursor:pointer;font-weight:500;color:var(--muted)}
  .seg button.on{background:var(--btn);color:var(--btn-fg)}
  .seg.two{grid-template-columns:1fr 1fr}
  .tab .dot{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 6px;margin-left:6px;border-radius:999px;font-size:11px;font-weight:700;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .sum{display:flex;gap:24px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
  .sum b{color:var(--fg);font-size:15px;margin-left:6px}
  .preview{border:1px dashed var(--line-2);border-radius:10px;padding:14px;background:var(--soft);font-size:13px}
  .preview .big{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-top:6px}
  .preview .arrow{color:var(--muted);font-weight:400}
  .preview .why{color:var(--muted);margin-top:6px;font-size:12px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(2,6,23,.55);display:grid;place-items:center;padding:16px;z-index:50;animation:f .15s ease}
  .modal{width:100%;max-width:460px;max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(2,6,23,.3)}
  .modal header{padding:18px 20px 0}
  .modal .body{padding:16px 20px}
  .modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 14px 14px}
  @keyframes f{from{opacity:0}to{opacity:1}}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btn-fg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;box-shadow:0 10px 30px rgba(2,6,23,.25)}
  .check{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer;margin:0}
  .check input{width:16px;height:16px;accent-color:var(--fg)}
  .login{max-width:380px;margin:48px auto 0}
  .sep{height:1px;background:var(--line);margin-block:16px}

  @media (max-width:820px){
    .stats{grid-template-columns:repeat(2,1fr)} .kpis{grid-template-columns:1fr}
    .grid-2{grid-template-columns:1fr}
  }
</style>
<script>
  (function(){
    var t=null;
    try{ t=localStorage.getItem('pg-theme'); }catch(e){}
    if(t!=='light' && t!=='dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>

<body>

<div class="strip"><div class="wrap">
  <b>Wireframe clickeable</b><span>Datos de ejemplo · nada se guarda</span>
  <span style="margin-left:auto;display:flex;gap:14px">
    <a href="#" data-go="login">1 Login</a><a href="#" data-go="panel">2 Panel</a><a href="#" data-go="nuevo">3 Crear cliente</a><a href="#" data-go="perfil">4 Perfil</a>
  </span>
</div></div>

<div id="shell"></div>
<div id="modal-root"></div>

<script>
/* ============ Utilidades ============ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
const dstr = d => d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const dayDiff = (a,b) => Math.round((a-b)/864e5);
const today = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
/* Suma meses; si el día no existe en el mes destino, cae en el último día (fin de mes) */
function addMonths(d, n){
  const t = new Date(d.getFullYear(), d.getMonth()+n, 1);
  const last = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  t.setDate(Math.min(d.getDate(), last));
  return t;
}

/* ============ Reglas de negocio ============ */
const WARN_DAYS = 5;   // "Próximo a vencer"
const BAJA_DAYS = 10;  // baja automática pasados N días del vencimiento

/* Vencimiento = recorre los pagos válidos en orden.
   - Pago atrasado (después del vencimiento): cuenta desde la fecha de pago.
   - Pago a tiempo o anticipado: cuenta desde el vencimiento actual. */
function dueOf(payments, candidate){
  const list = [...payments.filter(p => !p.void), candidate].filter(Boolean)
    .sort((a,b) => a.date.localeCompare(b.date));
  let due = null;
  for (const p of list){
    const d = parse(p.date);
    const base = (due && d <= due) ? due : d;
    due = addMonths(base, p.months);
  }
  return due;
}
function statusOf(c){
  const due = dueOf(c.payments);
  if (!due) return 'pendiente';
  const d = dayDiff(due, today);
  if (d < 0) return (-d > BAJA_DAYS) ? 'baja' : 'vencido';
  if (d <= WARN_DAYS) return 'porvencer';
  return 'activo';
}
const LABEL = {activo:'Activo', porvencer:'Próximo a vencer', vencido:'Pago vencido', baja:'De baja', pendiente:'Pendiente'};
const badge = s => `<span class="badge s-${s}">${LABEL[s]}</span>`;
const xbadge = s => s === 'pagado' ? `<span class="badge s-activo">Pagado</span>` : `<span class="badge s-porvencer">Pendiente</span>`;
const rel = due => {
  if (!due) return '—';
  const d = dayDiff(due, today);
  if (d === 0) return 'vence hoy';
  return d > 0 ? `en ${d} ${d===1?'día':'días'}` : `hace ${-d} ${d===-1?'día':'días'}`;
};

/* ============ Datos de ejemplo ============ */
let uid = 100;
function seed(name, phone, dueOffset, months=1, history=0, amount=25000){
  const c = {id:++uid, name, phone, notes:'', archived:false, payments:[], extras:[]};
  if (dueOffset !== null){
    const target = addDays(today, dueOffset);
    const last = addMonths(target, -months);
    for (let k = history; k >= 0; k--){
      const isLast = k === 0;
      c.payments.push({id:++uid, date: iso(addMonths(last, -k)), months: isLast?months:1,
        amount: isLast ? amount*months - (months>1?5000:0) : amount, method: k%2?'Efectivo':'Transferencia', void:false});
    }
  }
  return c;
}
let clients = [
  seed('Lucía Fernández','2920 41-2201', 21, 1, 3),
  seed('Martín Gómez','2920 43-8890', 3, 1, 2),
  seed('Sofía Ramírez','2920 45-1177', 12, 3, 1),
  seed('Diego Torres','2920 40-5532', -4, 1, 2),
  seed('Camila Herrera','2920 47-3321', -7, 1, 1),
  seed('Julián Paz','2920 44-9908', -18, 1, 1),
  seed('Valentina Ruiz','2920 42-6614', 1, 1, 4),
  seed('Nicolás Silva','2920 46-2087', null),
  seed('Carolina Díaz','2920 48-7305', 27, 1, 5),
  seed('Franco Acosta','2920 49-1450', -15, 1, 0),
];
clients[0].extras.push({id:++uid, date: iso(addDays(today,-3)), product:'Proteína whey 1 kg', amount:18000, note:'Lo paga la semana próxima', status:'pendiente', paidAt:null},
                       {id:++uid, date: iso(addDays(today,-12)), product:'Agua mineral', amount:1500, note:'', status:'pagado', paidAt: iso(addDays(today,-12))});
clients[1].extras.push({id:++uid, date: iso(addDays(today,-5)), product:'Shaker', amount:6500, note:'', status:'pagado', paidAt: iso(addDays(today,-5))});

/* ============ Estado de la UI ============ */
const ui = {view:'login', id:null, filter:'todos', q:'', tab:'pagos'};
const byId = id => clients.find(c => c.id === id);

/* ============ Shell ============ */
function shell(inner, authed=true){
  $('#shell').innerHTML = `
  <div class="top"><div class="wrap">
    <a class="brand" href="#" data-go="${authed?'panel':'login'}"><i>PG</i> Power Gym <small>Admin</small></a>
    <nav>
      ${authed ? `<button class="btn sm ghost" data-go="panel">Clientes</button>` : ''}
      <button class="btn sm theme" data-theme-toggle aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      ${authed ? `<button class="btn sm" data-go="login">Salir</button>` : ''}
    </nav>
  </div></div>
  <main><div class="wrap">${inner}</div></main>`;
}
function notes(items){
  return `<details class="notes" open><summary>Notas del wireframe</summary><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></details>`;
}

/* ============ 1. Login ============ */
function viewLogin(){
  shell(`
    <div class="login">
      <div class="brand" style="margin-bottom:20px"><i>PG</i> Power Gym <small>Admin</small></div>
      <h1>Iniciar sesión</h1>
      <p class="sub" style="margin-bottom:24px">Acceso solo para administradores.</p>
      <div class="card pad">
        <div class="field"><label>Email</label><input type="email" value="admin@powergym.com"></div>
        <div class="field"><label>Contraseña</label><input type="password" value="••••••••"></div>
        <button class="btn primary" style="width:100%" data-go="panel">Ingresar</button>
        <p class="hint" style="text-align:center;margin-top:14px">¿Olvidaste tu contraseña? <a href="#">Recuperarla</a></p>
      </div>
      <div style="margin-top:20px">${notes(['Un único rol: administrador.','Login con email y contraseña. Sin registro público: las cuentas las crea el dueño.'])}</div>
    </div>`, false);
}

/* ============ 2. Panel ============ */
function counts(){
  const act = clients.filter(c => !c.archived);
  const n = {total: act.length, activo:0, porvencer:0, vencido:0, baja:0, pendiente:0, archivados: clients.filter(c=>c.archived).length};
  act.forEach(c => n[statusOf(c)]++);
  return n;
}
function viewPanel(){
  const n = counts();
  shell(`
    <div class="row">
      <div><h1>Clientes</h1><p class="sub">${n.total} clientes en total.</p></div>
      <button class="btn primary" data-go="nuevo">+ Crear cliente</button>
    </div>
    <div class="stats">
      ${stat('todos','Total',n.total)}
      ${stat('activo','Activos',n.activo,'--c:var(--ok)')}
      ${stat('porvencer','Por vencer',n.porvencer,'--c:var(--warn)')}
      ${stat('vencido','Vencidos',n.vencido,'--c:var(--bad)')}
      ${stat('baja','De baja',n.baja,'--c:var(--off)')}
    </div>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
        <input type="search" id="q" placeholder="Buscar por nombre o teléfono" value="${esc(ui.q)}">
      </div>
      <div class="chips" id="chips">
        ${[['todos','Todos'],['activo','Activos'],['porvencer','Por vencer'],['vencido','Vencidos'],['baja','De baja'],['pendiente','Pendientes'],['archivado',`Archivados (${n.archivados})`]]
          .map(([k,l]) => `<button class="chip ${ui.filter===k?'on':''}" data-filter="${k}">${l}</button>`).join('')}
      </div>
    </div>
    <div class="card tbl-wrap" id="tbl"></div>
    <div style="margin-top:24px">${notes([
      'Los 5 contadores filtran la lista al hacer clic. El estado se calcula solo a partir del último pago válido.',
      '<b>Por vencer:</b> faltan 5 días o menos. <b>Vencido:</b> pasó el vencimiento (hasta 10 días). <b>De baja:</b> más de 10 días vencido.',
      '"Cargar pago" desde la fila abre el mismo modal que en el perfil. Un cliente de baja vuelve a Activo al cargar un pago.',
      'Clic en la fila abre el perfil del cliente.'])}</div>`);
  renderTable();
}
const stat = (k,l,v,style='') => `<button class="stat ${ui.filter===k?'on':''}" style="${style}" data-filter="${k}"><small>${l}</small><b>${v}</b></button>`;
function renderTable(){
  const q = ui.q.trim().toLowerCase();
  let list = clients.filter(c => ui.filter === 'archivado' ? c.archived : !c.archived);
  if (!['todos','archivado'].includes(ui.filter)) list = list.filter(c => statusOf(c) === ui.filter);
  if (q) list = list.filter(c => (c.name + c.phone).toLowerCase().includes(q));
  const order = {vencido:0, porvencer:1, baja:2, pendiente:3, activo:4};
  list.sort((a,b) => order[statusOf(a)] - order[statusOf(b)] || a.name.localeCompare(b.name));
  $('#tbl').innerHTML = list.length ? `
    <table><thead><tr><th>Cliente</th><th>Estado</th><th>Vencimiento</th><th class="r">Acción</th></tr></thead><tbody>
    ${list.map(c => { const s = statusOf(c), due = dueOf(c.payments); return `
      <tr class="click" data-open="${c.id}">
        <td><div class="name">${esc(c.name)}</div><div class="ph">${esc(c.phone)}</div></td>
        <td>${c.archived ? '<span class="badge s-baja">Archivado</span>' : badge(s)}</td>
        <td>${due ? dstr(due) : '—'}<div class="ph">${rel(due)}</div></td>
        <td class="r">${c.archived ? '' : `<button class="btn sm" data-pay="${c.id}">Cargar pago</button>`}</td>
      </tr>`; }).join('')}
    </tbody></table>` : `<div class="empty">No hay clientes que coincidan.</div>`;
}

/* ============ 3. Crear cliente ============ */
function viewNuevo(){
  shell(`
    <button class="crumb" data-go="panel">← Volver a clientes</button>
    <h1>Crear cliente</h1><p class="sub">Completá los datos básicos. Podés registrar el primer pago ahora o más tarde.</p>
    <div style="max-width:560px;margin-top:24px" class="stack">
      <form class="card pad" id="f-new">
        <div class="field"><label>Nombre completo *</label><input type="text" id="n-name" placeholder="Ej. Ana López" required></div>
        <div class="field"><label>Teléfono</label><input type="text" id="n-phone" placeholder="Ej. 2920 40-0000"></div>
        <div class="field"><label>Notas <span style="color:var(--muted);font-weight:400">(opcional)</span></label><textarea id="n-notes" placeholder="Objetivos, lesiones, observaciones…"></textarea></div>
        <div class="sep"></div>
        <label class="check"><input type="checkbox" id="n-first"> Registrar el primer pago ahora</label>
        <div id="n-pay" hidden style="margin-top:16px">
          <div class="field"><label>Meses a pagar</label>${seg(1)}</div>
          <div class="grid-2">
            <div class="field"><label>Monto</label><input type="number" id="n-amount" min="0" placeholder="0"></div>
            <div class="field"><label>Método</label>${methodSel()}</div>
          </div>
          <div class="field" style="margin-bottom:0"><label>Fecha de pago</label><input type="date" id="n-date" value="${iso(today)}"></div>
        </div>
        <div class="row" style="margin-top:24px;justify-content:flex-end">
          <button type="button" class="btn" data-go="panel">Cancelar</button>
          <button type="submit" class="btn primary">Crear cliente</button>
        </div>
      </form>
      ${notes(['Si no se registra un pago, el cliente queda <b>Pendiente</b> y pasa a <b>Activo</b> con su primer pago.','Si se registra, el vencimiento se calcula desde la fecha de pago.'])}
    </div>`);
  const first = $('#n-first'); first.onchange = () => $('#n-pay').hidden = !first.checked;
  wireSeg($('#n-pay'));
  $('#f-new').onsubmit = e => {
    e.preventDefault();
    const c = {id:++uid, name:$('#n-name').value.trim(), phone:$('#n-phone').value.trim(), notes:$('#n-notes').value.trim(), archived:false, payments:[], extras:[]};
    if (!c.name) return;
    if (first.checked){
      const amt = +$('#n-amount').value;
      if (!(amt > 0)) { $('#n-amount').focus(); return toast('Ingresá el monto del primer pago'); }
      c.payments.push({id:++uid, date:$('#n-date').value, months:+$('#n-pay .seg .on').dataset.m, amount:amt, method:$('#n-method').value, void:false});
    }
    clients.unshift(c); toast('Cliente creado'); go('perfil', c.id);
  };
}
const seg = (m=1) => `<div class="seg">${[1,2,3].map(x => `<button type="button" data-m="${x}" class="${x===m?'on':''}">${x} ${x===1?'mes':'meses'}</button>`).join('')}</div><div class="hint">Máximo 3 meses por pago.</div>`;
const methodSel = (v='Efectivo') => `<select id="${$('#n-pay')||ui.view==='nuevo'?'n-method':'m-method'}">${['Efectivo','Transferencia','Otro'].map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
function wireSeg(root, cb){ $$('.seg button', root).forEach(b => b.onclick = () => { $$('.seg button', root).forEach(x => x.classList.toggle('on', x===b)); cb && cb(); }); }

/* ============ 4. Perfil ============ */
function viewPerfil(){
  const c = byId(ui.id); if (!c) return go('panel');
  const s = statusOf(c), due = dueOf(c.payments);
  const valid = c.payments.filter(p => !p.void).sort((a,b) => b.date.localeCompare(a.date));
  const extrasTotal = c.extras.reduce((t,e) => t + e.amount, 0);
  shell(`
    <button class="crumb" data-go="panel">← Volver a clientes</button>
    <div class="row">
      <div>
        <div class="row" style="justify-content:flex-start;gap:12px"><h1>${esc(c.name)}</h1>${c.archived ? '<span class="badge s-baja">Archivado</span>' : badge(s)}</div>
        <p class="sub">${esc(c.phone || 'Sin teléfono')}${c.notes ? ' · ' + esc(c.notes) : ''}</p>
      </div>
      <div class="row" style="gap:8px">
        ${c.archived
          ? `<button class="btn" data-restore="${c.id}">Restaurar cliente</button>`
          : `<button class="btn" data-archive="${c.id}">Archivar</button><button class="btn primary" data-pay="${c.id}">Cargar pago</button>`}
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Próximo vencimiento</small><b>${due ? dstr(due) : '—'}</b><span>${rel(due)}</span></div>
      <div class="kpi"><small>Último pago</small><b>${valid[0] ? money(valid[0].amount) : '—'}</b><span>${valid[0] ? dstr(parse(valid[0].date)) + ' · ' + valid[0].months + (valid[0].months===1?' mes':' meses') : 'Sin pagos'}</span></div>
      <div class="kpi"><small>Pagos realizados</small><b>${valid.length}</b><span>${money(valid.reduce((t,p)=>t+p.amount,0))} en total</span></div>
    </div>
    <div class="tabs">
      <button class="tab ${ui.tab==='pagos'?'on':''}" data-tab="pagos">Pagos mensuales</button>
      <button class="tab ${ui.tab==='extras'?'on':''}" data-tab="extras">Cobros extras${c.extras.some(e=>e.status==='pendiente') ? `<span class="dot" title="Cobros pendientes">${c.extras.filter(e=>e.status==='pendiente').length}</span>` : ''}</button>
    </div>
    <div id="tab-body"></div>
    <div style="margin-top:24px">${notes([
      '<b>Pagos mensuales:</b> historial completo. Cada pago se puede editar o anular; el vencimiento y el estado se recalculan solos.',
      '<b>Cobros extras:</b> productos vendidos, cargados a mano. Van aparte: no cambian el estado ni el vencimiento.',
      'Cada cobro extra tiene estado <b>Pagado</b> o <b>Pendiente</b>. Un producto pendiente deja registro de qué se llevó el cliente y se marca como pagado cuando lo cobre. El número naranja en la pestaña indica cuántos quedan pendientes.',
      '<b>Archivar</b> saca al cliente de las listas pero conserva todo su historial. Se puede restaurar.'])}</div>`);
  renderTab(c);
}
function renderTab(c){
  const body = $('#tab-body');
  if (ui.tab === 'pagos'){
    const list = [...c.payments].sort((a,b) => b.date.localeCompare(a.date));
    body.innerHTML = `<div class="card tbl-wrap">${list.length ? `
      <table><thead><tr><th>Fecha</th><th>Período</th><th>Método</th><th class="r">Monto</th><th class="r">Acciones</th></tr></thead><tbody>
      ${list.map(p => `<tr class="${p.void?'void':''}">
        <td>${dstr(parse(p.date))}</td>
        <td>${p.months} ${p.months===1?'mes':'meses'} ${p.void?'<span class="badge s-baja" style="margin-left:6px">Anulado</span>':''}</td>
        <td>${esc(p.method)}</td><td class="r amt">${money(p.amount)}</td>
        <td class="r">${p.void || c.archived ? '' : `<button class="link" data-editpay="${p.id}">Editar</button> &nbsp; <button class="link bad" data-voidpay="${p.id}">Anular</button>`}</td>
      </tr>`).join('')}</tbody></table>` : `<div class="empty">Todavía no hay pagos registrados.</div>`}</div>`;
  } else {
    const list = [...c.extras].sort((a,b) => b.date.localeCompare(a.date));
    body.innerHTML = `
      <div class="row" style="margin-bottom:12px"><p class="sub" style="margin:0">Ventas de productos, aparte de la cuota mensual.</p>
        ${c.archived ? '' : `<button class="btn sm" data-addextra="${c.id}">+ Agregar cobro extra</button>`}</div>
      <div class="card tbl-wrap">${list.length ? `
        <table><thead><tr><th>Fecha</th><th>Producto</th><th>Estado</th><th class="r">Monto</th><th class="r">Acción</th></tr></thead><tbody>
        ${list.map(e => `<tr>
          <td>${dstr(parse(e.date))}</td>
          <td><div class="name" style="font-weight:500">${esc(e.product)}</div>${e.note ? `<div class="ph">${esc(e.note)}</div>` : ''}</td>
          <td>${xbadge(e.status)}${e.status==='pagado' && e.paidAt ? `<div class="ph">Cobrado el ${dstr(parse(e.paidAt))}</div>` : ''}</td>
          <td class="r">${money(e.amount)}</td>
          <td class="r">${c.archived ? '' : e.status==='pendiente'
            ? `<button class="btn sm" data-xpaid="${e.id}">Marcar como pagado</button>`
            : `<button class="link" data-xundo="${e.id}">Volver a pendiente</button>`}</td>
        </tr>`).join('')}
        </tbody></table>` : `<div class="empty">No hay cobros extras.</div>`}</div>
      ${list.length ? `<div class="sum"><span>Pendiente de cobro<b style="color:var(--warn)">${money(list.filter(e=>e.status==='pendiente').reduce((t,e)=>t+e.amount,0))}</b></span><span>Cobrado<b>${money(list.filter(e=>e.status==='pagado').reduce((t,e)=>t+e.amount,0))}</b></span></div>` : ''}`;
  }
}

/* ============ Modales ============ */
function openModal(html){
  closeModal();
  $('#modal-root').innerHTML = `<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#ov').addEventListener('mousedown', e => { if (e.target.id === 'ov') closeModal(); });
}
const closeModal = () => $('#modal-root').innerHTML = '';
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* Cargar / editar pago */
function openPago(cid, editId=null){
  const c = byId(cid), editing = editId ? c.payments.find(p => p.id === editId) : null;
  openModal(`
    <header><h2>${editing ? 'Editar pago' : 'Cargar pago'}</h2><p class="sub">${esc(c.name)}</p></header>
    <div class="body">
      <div class="field"><label>Meses a pagar</label>${seg(editing ? editing.months : 1).replace(/<div class="hint">.*$/, '')}<div class="hint">Máximo 3 meses por pago.</div></div>
      <div class="grid-2">
        <div class="field"><label>Monto</label><input type="number" id="m-amount" min="0" placeholder="0" value="${editing ? editing.amount : ''}"></div>
        <div class="field"><label>Método</label>${methodSel(editing ? editing.method : 'Efectivo')}</div>
      </div>
      <div class="field"><label>Fecha de pago</label><input type="date" id="m-date" value="${editing ? editing.date : iso(today)}"></div>
      <div class="preview" id="pv"></div>
    </div>
    <footer><button class="btn" id="m-cancel">Cancelar</button><button class="btn primary" id="m-ok">${editing ? 'Guardar cambios' : 'Confirmar pago'}</button></footer>`);
  const months = () => +$('.seg .on').dataset.m;
  const upd = () => {
    const others = c.payments.filter(p => !p.void && p.id !== editId);
    const date = $('#m-date').value || iso(today);
    const cur = dueOf(others), next = dueOf(others, {date, months:months(), id:'x'});
    let why = 'Primer pago: el vencimiento se cuenta desde la fecha de pago.';
    if (cur) why = parse(date) <= cur ? 'Pago a tiempo o anticipado: se suma desde el vencimiento actual.' : 'Pago atrasado: se cuenta desde la fecha de pago.';
    $('#pv').innerHTML = `<span style="color:var(--muted)">Nuevo vencimiento</span>
      <div class="big"><span style="font-weight:500;color:var(--muted)">${cur ? dstr(cur) : 'Sin vencimiento'}</span><span class="arrow">→</span><span>${dstr(next)}</span></div>
      <div class="why">${why}${statusOf(c)==='baja' && !editing ? ' El cliente vuelve a Activo.' : ''}</div>`;
    $('#m-ok').disabled = !(+$('#m-amount').value > 0);
  };
  wireSeg($('.modal'), upd); ['#m-amount','#m-date'].forEach(s => $(s).addEventListener('input', upd)); upd();
  $('#m-cancel').onclick = closeModal;
  $('#m-ok').onclick = () => {
    const data = {date:$('#m-date').value, months:months(), amount:+$('#m-amount').value, method:$('#m-method').value};
    if (editing) Object.assign(editing, data); else c.payments.push({id:++uid, void:false, ...data});
    closeModal(); toast(editing ? 'Pago actualizado' : 'Pago registrado'); render();
  };
}
/* Cobro extra */
function openExtra(cid){
  const c = byId(cid);
  openModal(`
    <header><h2>Agregar cobro extra</h2><p class="sub">${esc(c.name)} · no afecta el vencimiento</p></header>
    <div class="body">
      <div class="field"><label>Producto</label><input type="text" id="e-prod" placeholder="Ej. Proteína whey 1 kg"></div>
      <div class="grid-2">
        <div class="field"><label>Monto</label><input type="number" id="e-amt" min="0" placeholder="0"></div>
        <div class="field"><label>Fecha</label><input type="date" id="e-date" value="${iso(today)}"></div>
      </div>
      <div class="field"><label>Estado del cobro</label>
        <div class="seg two"><button type="button" data-s="pagado" class="on">Pagado</button><button type="button" data-s="pendiente">Pendiente</button></div>
        <div class="hint" id="e-hint">El cliente ya pagó este producto.</div></div>
      <div class="field" style="margin-bottom:0"><label>Nota <span style="color:var(--muted);font-weight:400">(opcional)</span></label><input type="text" id="e-note"></div>
    </div>
    <footer><button class="btn" id="m-cancel">Cancelar</button><button class="btn primary" id="m-ok" disabled>Agregar cobro</button></footer>`);
  const chk = () => $('#m-ok').disabled = !($('#e-prod').value.trim() && +$('#e-amt').value > 0);
  ['#e-prod','#e-amt'].forEach(s => $(s).addEventListener('input', chk));
  const xs = () => $('.seg .on').dataset.s;
  wireSeg($('.modal'), () => $('#e-hint').textContent = xs()==='pagado' ? 'El cliente ya pagó este producto.' : 'Queda registrado para cobrarlo más adelante.');
  $('#m-cancel').onclick = closeModal;
  $('#m-ok').onclick = () => {
    const st = xs(), date = $('#e-date').value;
    c.extras.push({id:++uid, date, product:$('#e-prod').value.trim(), amount:+$('#e-amt').value, note:$('#e-note').value.trim(), status:st, paidAt: st==='pagado' ? date : null});
    closeModal(); toast(st==='pagado' ? 'Cobro extra registrado como pagado' : 'Cobro extra registrado como pendiente'); render();
  };
}
/* Confirmaciones */
function confirmBox({title, text, ok, danger, onOk}){
  openModal(`<header><h2>${title}</h2></header><div class="body"><p style="color:var(--muted)">${text}</p></div>
    <footer><button class="btn" id="m-cancel">Cancelar</button><button class="btn primary ${danger?'danger':''}" id="m-ok" ${danger?'style="background:var(--bad);border-color:var(--bad);color:#fff"':''}>${ok}</button></footer>`);
  $('#m-cancel').onclick = closeModal; $('#m-ok').onclick = () => { closeModal(); onOk(); };
}

/* ============ Router y eventos ============ */
function render(){ ({login:viewLogin, panel:viewPanel, nuevo:viewNuevo, perfil:viewPerfil})[ui.view](); window.scrollTo(0,0); }
function go(view, id=null){ ui.view = view; if (id) ui.id = id; if (view === 'perfil' && id) ui.tab = 'pagos'; if (view === 'perfil' && !ui.id) ui.id = clients[0].id; closeModal(); render(); }
let tt; function toast(m){ clearTimeout(tt); $$('.toast').forEach(t=>t.remove()); const t = document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); tt = setTimeout(()=>t.remove(), 2400); }

document.addEventListener('click', e => {
  if (e.target.closest('[data-theme-toggle]')){
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('pg-theme', next); }catch(err){}
    return;
  }
  const t = e.target.closest('[data-go],[data-filter],[data-open],[data-pay],[data-tab],[data-editpay],[data-voidpay],[data-addextra],[data-archive],[data-restore],[data-xpaid],[data-xundo]');
  if (!t) return;
  const d = t.dataset;
  if (d.go){ e.preventDefault(); return go(d.go); }
  if (d.filter){ ui.filter = d.filter; return render(); }
  if (d.pay){ e.stopPropagation(); return openPago(+d.pay); }
  if (d.open){ return go('perfil', +d.open); }
  if (d.tab){ ui.tab = d.tab; return viewPerfil(); }
  if (d.editpay) return openPago(ui.id, +d.editpay);
  if (d.voidpay) return confirmBox({title:'Anular pago', text:'El pago queda en el historial como anulado y se recalculan el vencimiento y el estado del cliente.', ok:'Anular pago', danger:true,
    onOk(){ byId(ui.id).payments.find(p => p.id === +d.voidpay).void = true; toast('Pago anulado'); render(); }});
  if (d.addextra) return openExtra(+d.addextra);
  if (d.xpaid || d.xundo){
    const x = byId(ui.id).extras.find(e => e.id === +(d.xpaid || d.xundo));
    if (d.xpaid){ x.status = 'pagado'; x.paidAt = iso(today); toast('Cobro marcado como pagado'); }
    else { x.status = 'pendiente'; x.paidAt = null; toast('Cobro vuelto a pendiente'); }
    return render();
  }
  if (d.archive) return confirmBox({title:'Archivar cliente', text:'Dejará de aparecer en las listas. Se conserva todo su historial y podés restaurarlo cuando quieras desde el filtro "Archivados".', ok:'Archivar',
    onOk(){ byId(+d.archive).archived = true; toast('Cliente archivado'); go('panel'); }});
  if (d.restore){ byId(+d.restore).archived = false; toast('Cliente restaurado'); return render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q'){ ui.q = e.target.value; renderTable(); } });

render();
</script>
</body>
</html>
